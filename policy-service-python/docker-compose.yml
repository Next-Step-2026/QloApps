services:
  policy-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: policy-service-engine
    ports:
      - "8105:8105"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8105/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
