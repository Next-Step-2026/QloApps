openapi: 3.1.0
info:
  title: Copiloto de Consulta de Reservas API (Sidecar C++)
  version: 1.0.0
  description: API local de alta performance para interpretacao deterministica de intencoes de reservas hoteleiras (RFC-001 / QLO-FEAT-001).
servers:
  - url: http://127.0.0.1:8101
    description: Servico local em loopback

paths:
  /healthz:
    get:
      summary: Healthcheck do servico local
      operationId: getHealthz
      responses:
        '200':
          description: Servico operacional
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: "UP"

  /v1/assist/interpret:
    post:
      summary: Interpreta consulta de hospede em linguagem natural
      operationId: interpretQuery
      parameters:
        - name: X-Correlation-ID
          in: header
          required: true
          description: Identificador unico de rastreabilidade da requisicao
          schema:
            type: string
            example: "req-123e4567-e89b"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterpretRequest'
      responses:
        '200':
          description: Interpretacao semantica realizada com sucesso
          headers:
            X-Correlation-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterpretResponse'
        '400':
          description: Requisicao invalida conforme RFC 7807
          content:
            application/problem+json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Media Type nao suportado conforme RFC 7807
          content:
            application/problem+json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  schemas:
    InterpretRequest:
      type: object
      additionalProperties: false
      required:
        - query
        - reference_date
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 256
          description: Texto da duvida do hospede digitada pelo atendente
          example: "tem quarto deluxe para depois de amanha para 2 pessoas?"
        reference_date:
          type: string
          format: date
          pattern: '^(20\d{2})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'
          description: Data base para calculo temporal no formato YYYY-MM-DD
          example: "2026-08-27"
        locale:
          type: string
          default: "pt-BR"
          description: Idioma da consulta
          example: "pt-BR"

    InterpretResponse:
      type: object
      required:
        - correlation_id
        - intent
        - confidence
        - slots
        - explanation
      properties:
        correlation_id:
          type: string
          example: "req-123e4567-e89b"
        intent:
          type: string
          enum:
            - AVAILABILITY_QUERY
            - POLICY_QUERY
            - RESERVATION_LOOKUP
            - UNKNOWN
          example: "AVAILABILITY_QUERY"
        confidence:
          type: number
          minimum: 0.0
          maximum: 1.0
          example: 0.95
        slots:
          type: object
          properties:
            room_type:
              type:
                - string
                - 'null'
              example: "deluxe"
            check_in:
              type:
                - string
                - 'null'
              pattern: '^\d{4}-\d{2}-\d{2}$'
              example: "2026-08-29"
            check_out:
              type:
                - string
                - 'null'
              pattern: '^\d{4}-\d{2}-\d{2}$'
              example: "2026-08-30"
            guests:
              type:
                - integer
                - 'null'
              minimum: 1
              maximum: 10
              example: 2
            policy_category:
              type:
                - string
                - 'null'
              example: null
            reservation_code:
              type:
                - string
                - 'null'
              example: null
        explanation:
          type: string
          example: "Identificado tipo de quarto 'deluxe', contagem de hospedes (2) e data relativa."

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri
          example: "https://hotel.local/errors/invalid-payload"
        title:
          type: string
          example: "Requisicao Invalida"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "O campo obrigatorio 'reference_date' nao foi informado."
        instance:
          type: string
          example: "/v1/assist/interpret"
        invalid_params:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              reason:
                type: string
